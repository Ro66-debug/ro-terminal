name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data.json'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # Called by update-data.yml so a fresh snapshot is published immediately.
  # Pushes made with GITHUB_TOKEN do not fire `push` triggers, so this is the
  # only way a data commit reaches Pages.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once, and never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run if it does not exist yet.
          enablement: true

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html data.json _site/
          [ -d assets ] && cp -r assets _site/assets || true
          touch _site/.nojekyll
          ls -la _site
          echo "data.json generatedAt: $(node -p "require('./data.json').generatedAt")"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Report URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
