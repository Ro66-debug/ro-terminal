name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data.json'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # Called by update-data.yml so a fresh snapshot is published immediately.
  # Pushes made with GITHUB_TOKEN do not fire `push` triggers, so this is the
  # only way a data commit reaches Pages.
  workflow_call:

# Branch-based Pages deploy: we force-push the built site to `gh-pages` and
# GitHub's own "pages build and deployment" picks it up from there. We do NOT
# use actions/deploy-pages because creating a Pages site through the API needs
# repo-admin rights that GITHUB_TOKEN does not have; pushing a branch does not.
permissions:
  contents: write

# Never run two Pages deployments at once, and never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always deploy the CURRENT tip of main, not the SHA that triggered
          # this run. When update-data.yml calls us, the data.json commit it
          # just pushed is newer than the triggering SHA — checking out the
          # trigger would deploy the previous snapshot.
          ref: main

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html data.json _site/
          [ -d assets ] && cp -r assets _site/assets || true
          touch _site/.nojekyll
          ls -la _site
          echo "data.json generatedAt: $(node -p "require('./data.json').generatedAt")"

      - name: Push to gh-pages
        run: |
          set -euo pipefail
          cd _site
          git init -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Single-commit branch, force-pushed — no history accumulation.
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          echo "Pushed gh-pages. Site (once Pages is enabled for the gh-pages branch): https://${owner}.github.io/${repo}/" >> "$GITHUB_STEP_SUMMARY"
