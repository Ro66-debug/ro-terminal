name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data.json'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # Called by update-data.yml so a fresh snapshot is published immediately.
  # Pushes made with GITHUB_TOKEN do not fire `push` triggers, so this is the
  # only way a data commit reaches Pages.
  workflow_call:

# Two deploy paths, because GITHUB_TOKEN cannot CREATE a Pages site and we
# cannot know from in here which source the repo's Pages settings use:
#  - gh-pages branch push  → picked up when Pages source is "Deploy from a branch"
#  - actions/deploy-pages  → picked up when Pages source is "GitHub Actions"
# Each step tolerates the other's configuration, so whichever one matches the
# settings wins and the other is a no-op.
permissions:
  contents: write
  pages: write
  id-token: write

# Never run two Pages deployments at once, and never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Always deploy the CURRENT tip of main, not the SHA that triggered
          # this run. When update-data.yml calls us, the data.json commit it
          # just pushed is newer than the triggering SHA — checking out the
          # trigger would deploy the previous snapshot.
          ref: main

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html data.json _site/
          [ -d assets ] && cp -r assets _site/assets || true
          touch _site/.nojekyll
          ls -la _site
          echo "data.json generatedAt: $(node -p "require('./data.json').generatedAt")"

      - name: Push to gh-pages (used when Pages source is a branch)
        run: |
          set -euo pipefail
          cd _site
          git init -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Single-commit branch, force-pushed — no history accumulation.
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Official Actions deployment — works once the Pages site exists with
      # source "GitHub Actions". Site creation needs admin rights GITHUB_TOKEN
      # lacks, hence enablement stays off and errors are tolerated.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
        with:
          enablement: false

      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Report
        run: |
          set -uo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          url="https://${owner}.github.io/${repo}/"
          {
            echo "### Pages deploy"
            echo ""
            echo "- gh-pages branch: pushed"
            echo "- actions deployment: ${{ steps.deployment.outcome }}"
            echo "- expected URL: ${url}"
          } >> "$GITHUB_STEP_SUMMARY"
